version: 2.1

jobs:
  test:
    docker:
      - image: cimg/android:2024.01-ndk
    environment:
      JVM_OPTS: "-Xmx3200m"
    steps:
      - checkout

      - run:
          name: Make Gradle Wrapper Executable
          command: chmod +x gradlew

      - restore_cache:
          key: v1-gradle-cache-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "core/build.gradle.kts" }}

      - run:
          name: Download Dependencies
          command: ./gradlew androidDependencies

      - save_cache:
          key: v1-gradle-cache-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "core/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - run:
          name: Run Unit Tests with Smarter Testing
          command: ./gradlew testDebugUnitTest

      - run:
          name: Collect Test Results for CircleCI Dashboard
          command: |
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/build/test-results/test.*DebugUnitTest/.*xml" -exec cp {} ~/test-results/junit/ \;

      - store_test_results:
          path: ~/test-results/junit

      - store_artifacts:
          path: app/build/reports
          destination: reports

workflows:
  version: 2
  test_workflow:
    jobs:
      - test
